services:
  db:
    image: postgres:16
    container_name: pac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pac_db
      POSTGRES_USER: pac_user
      POSTGRES_PASSWORD: pac_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
